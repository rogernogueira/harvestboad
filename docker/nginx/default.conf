# O TLS termina no proxy reverso (192.168.105.5). Aqui dentro tudo é HTTP; o
# esquema original chega no X-Forwarded-Proto e é repassado ao Django, que
# precisa dele para montar URLs absolutas e validar o CSRF.
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # DNS interno do Docker. Resolver o upstream em tempo de requisição, e não
    # ao carregar a configuração, tem duas consequências boas: o nginx sobe
    # mesmo com a API ainda fora do ar (devolve 502 em vez de recusar a subir),
    # e reencontra o container quando ele reinicia com outro IP.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://api:8000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API e admin: mesma origem do SPA, portanto sem CORS ----------------
    location ^~ /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_set_header X-Forwarded-Host  $host;
        # As telas de coleta esperam o Harvester, que às vezes demora.
        proxy_read_timeout 120s;
    }

    location ^~ /admin/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Estáticos do Django admin e do Swagger, vindos do collectstatic.
    location ^~ /static/ {
        alias /var/www/django-static/;
        # Um único Cache-Control: `expires` emitiria o seu próprio, e a resposta
        # sairia com o cabeçalho duplicado.
        add_header Cache-Control "public, max-age=31536000";
    }

    # --- SPA ----------------------------------------------------------------
    # Os arquivos do Vite levam hash no nome, então podem ser imutáveis.
    location ^~ /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # O index.html não pode ser cacheado: é ele que aponta para os assets novos
    # a cada deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Um arquivo com extensão que não existe tem que dar 404. Sem este bloco ele
    # cairia no fallback da SPA e responderia 200 com o HTML da página inteira:
    # uma imagem quebrada passaria despercebida, um <script> tentaria executar
    # HTML, e intermediários guardariam a página no lugar do asset.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|css|js|mjs|map|json|webmanifest|woff2?|ttf|otf|eot|txt|xml|pdf|zip|csv)$ {
        try_files $uri =404;
    }

    # Rotas do react-router não existem em disco; só elas caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
