services:
  postgres:
    image: postgres:18-alpine
    container_name: harvestboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harvestboard}
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Evita recriar o cluster a cada boot quando o volume já existe
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # 5433 no host: a porta 5432 já é usada pelo PostgreSQL 16 instalado na máquina
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor} -d ${POSTGRES_DB:-harvestboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: harvestboard_redis
    restart: unless-stopped
    # Guarda o cache das respostas do Harvester. A persistência em disco é o que
    # faz o cache sobreviver a reinício do container — sem ela, voltaria frio e
    # a primeira carga de cada tela pagaria a lentidão da origem de novo.
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    ports:
      # 6380 no host: 6379 já é usada por outro projeto nesta máquina
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: harvestboard_api
    restart: unless-stopped
    # O .env traz os valores de desenvolvimento; o bloco abaixo sobrescreve o
    # que muda dentro da rede do compose (o compose dá precedência a
    # `environment` sobre `env_file`).
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-harvestboard}
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_CORS_ORIGINS: ${DJANGO_CORS_ORIGINS:-}
    volumes:
      # O nginx serve estes arquivos em /static/; o collectstatic os escreve aqui.
      - django_static:/app/staticfiles
    # Sem `ports`: o gunicorn só é alcançável pela rede interna, através do nginx.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: harvestboard_web
    restart: unless-stopped
    ports:
      # Esta é a porta que o proxy reverso deve alvejar.
      - "${WEB_PORT:-8085}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - django_static:/var/www/django-static:ro
    depends_on:
      - api

volumes:
  postgres_data:
    name: harvestboard_postgres_data
  redis_data:
    name: harvestboard_redis_data
  django_static:
    name: harvestboard_django_static
