services:
  postgres:
    image: postgres:18-alpine
    container_name: monitor_integra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitor_integra}
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Evita recriar o cluster a cada boot quando o volume já existe
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # 5433 no host: a porta 5432 já é usada pelo PostgreSQL 16 instalado na máquina
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor} -d ${POSTGRES_DB:-monitor_integra}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: monitor_integra_redis
    restart: unless-stopped
    # Guarda o cache das respostas do Harvester. A persistência em disco é o que
    # faz o cache sobreviver a reinício do container — sem ela, voltaria frio e
    # a primeira carga de cada tela pagaria a lentidão da origem de novo.
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    ports:
      # 6380 no host: 6379 já é usada por outro projeto nesta máquina
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: monitor_integra_postgres_data
  redis_data:
    name: monitor_integra_redis_data
